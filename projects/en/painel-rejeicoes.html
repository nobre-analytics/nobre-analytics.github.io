<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rejections · Payment handling</title>
<meta name="description" content="Demo with fictitious data of the rejected-payment handling panel: queues by decision, write-off bot and a dashboard of the payment path.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23048A05'/%3E%3Cpath d='M13 9l-5 5 5 5M8.5 14H19a5 5 0 0 1 0 10h-3' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='24' r='2.4' fill='%23F5BF05'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
(function(){try{var t=localStorage.getItem("demo-tema");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();
</script>
<style>
:root{
  color-scheme:light;
  --canvas:#F3F3F3; --surface:#FFFFFF; --sunken:#F7F7F6; --hover:#EFF7EF;
  --border:#E3E4E1; --border-strong:#C9CCC7;
  --text:#333333; --text-2:#4A4A4A; --text-3:#6C6E6B;
  --marca:#048A05; --marca-fundo:#037604; --marca-texto:#00661F; --marca-tinta:#E6F3E6;
  --destaque:#F5BF05; --destaque-2:#E0AE00; --destaque-ink:#33321F; --destaque-tinta:#FDF3D2;
  --danger:#C02B1D; --danger-tinta:#FBECEA; --warning:#8A6200;
  --barra-fundo:#E6E7E4;
  --sombra:0 1px 2px rgba(20,32,20,.05),0 6px 16px -10px rgba(20,32,20,.22);
  --sombra-2:0 2px 4px rgba(20,32,20,.06),0 16px 32px -16px rgba(20,32,20,.30);
  --ff-titulo:"Bree Serif",Georgia,"Times New Roman",serif;
  --ff:"Open Sans","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --canvas:#10140F; --surface:#191E17; --sunken:#131711; --hover:#1F2A1D;
  --border:#2A3127; --border-strong:#3C453A;
  --text:#ECEFEA; --text-2:#B9BEB5; --text-3:#99A095;
  --marca:#0B7A0C; --marca-fundo:#096509; --marca-texto:#63C264; --marca-tinta:#1D2D1B;
  --destaque-tinta:#3A3218; --danger:#F0655A; --danger-tinta:#3A1F1C; --warning:#E4B437;
  --barra-fundo:#232A21;
  --sombra:0 1px 2px rgba(0,0,0,.35); --sombra-2:0 10px 28px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:14px/1.5 var(--ff);background:var(--canvas);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:var(--destaque);color:var(--destaque-ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--marca-texto);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none}
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}

/* tarja */
.tarja{background:var(--marca-fundo);color:#fff;font-size:12.5px;font-weight:600;height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:16px;white-space:nowrap;overflow:hidden}
.tarja .vivo{display:inline-flex;align-items:center;gap:7px}
.tarja .vivo::before{content:"";width:7px;height:7px;border-radius:50%;background:#B9F5BA}
.tarja.rodando .vivo::before{background:var(--destaque);animation:pulsa 1s infinite}
.tarja .dir{display:flex;gap:16px}
.tarja .demo{background:var(--destaque);color:var(--destaque-ink);border-radius:3px;padding:0 7px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
@keyframes pulsa{50%{opacity:.35}}

/* topo */
.topo{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:8px 18px;position:sticky;top:0;z-index:20}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:178px}
.marca svg{width:22px;height:22px;color:var(--text)}
.marca b{display:block;font:400 19px/1.05 var(--ff-titulo);color:var(--marca-texto)}
.marca small{display:block;font-size:11px;color:var(--text-3)}
.busca{flex:1;max-width:312px;height:34px;border:1px solid var(--border-strong);background:var(--sunken);border-radius:4px;padding:0 10px;font-size:13.5px}
.busca::placeholder{color:var(--text-3)}
.grupo{margin-left:auto;display:flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;background:var(--surface)}
.grupo button{border:0;background:none;padding:0 12px;height:32px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-left:1px solid var(--border)}
.grupo button:first-child{border-left:0}
.grupo button:hover{background:var(--hover);color:var(--marca-texto)}

/* casca */
.casca{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 75px)}
.lado{background:var(--surface);border-right:1px solid var(--border);padding:12px 8px 24px;position:sticky;top:var(--topo-h,51px);height:calc(100vh - var(--topo-h,51px));overflow:auto}
.lado h4{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);padding:14px 10px 6px;border-top:1px solid var(--border);margin-top:10px}
.item{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:5px;padding:7px 10px;font-size:13.5px;cursor:pointer;text-align:left;position:relative;color:var(--text-2)}
.item:hover{background:var(--sunken);color:var(--text)}
.item.on{background:var(--hover);color:var(--marca-texto);font-weight:700}
.item.on::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--destaque)}
.item .ni{flex:1}
.cont{font-size:11px;font-weight:700;min-width:22px;text-align:center;border-radius:9px;padding:0 7px;line-height:18px;color:var(--text-3)}
.cont.v{background:var(--marca-tinta);color:var(--marca-texto)}
.cont.r{background:var(--danger);color:#fff}
.cont.f{background:var(--marca-fundo);color:#fff}
:root[data-theme=dark] .cont.r{background:#B3261A}

main{min-width:0;display:flex;flex-direction:column}
.banda{background:var(--marca);color:#fff;padding:18px 22px 20px}
.banda h1{font:400 28px/1.1 var(--ff-titulo)}
.banda p{font-size:13px;opacity:.9;margin-top:4px}
.conteudo{padding:16px 22px 40px;display:flex;flex-direction:column;gap:14px;flex:1}
.rodape{background:var(--marca-fundo);color:#fff;font-size:12.5px;display:flex;justify-content:space-between;gap:12px;padding:10px 22px;flex-wrap:wrap}

/* blocos */
.folha{background:var(--surface);border-radius:8px;box-shadow:var(--sombra);padding:14px 16px}
.folha-cab{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.folha-cab h2,.folha-cab h3{font:400 19px/1.25 var(--ff-titulo);color:var(--text)}
.folha-cab .meta{font-size:12.5px;color:var(--text-3)}
.folha-cab .dir{margin-left:auto}
.rot{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.btn{height:34px;border:1px solid var(--border-strong);background:var(--surface);border-radius:4px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--hover);color:var(--marca-texto)}
.btn.prim{background:var(--destaque);border-color:var(--destaque);color:var(--destaque-ink);font-weight:700}
.btn.prim:hover{background:var(--destaque-2);border-color:var(--destaque-2);color:var(--destaque-ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.peq{height:30px;padding:0 11px;font-size:12.5px}

.filtros{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filtros .rot{margin-right:6px}
.filtros select{height:30px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface);padding:0 8px;font-size:12.5px}
.filtros label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2)}
.filtros input[type=checkbox]{accent-color:var(--marca)}
.filtros .soma{margin-left:auto;font-size:12.5px;color:var(--text-3)}

.acao{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.acao .t{flex:1;min-width:220px}
.acao .t b{font:400 18px/1.3 var(--ff-titulo);display:flex;align-items:center;gap:8px}
.acao .t b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--marca)}
.acao .t span{font-size:12.5px;color:var(--text-3)}
.etq{display:inline-block;background:var(--destaque-tinta);border:1px solid color-mix(in srgb,var(--destaque) 55%,transparent);color:var(--text);border-radius:4px;padding:6px 10px;font-size:12.5px;margin-top:10px;width:100%}

/* cartões de caso */
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.caso{background:var(--surface);border-radius:8px;box-shadow:var(--sombra);border:1px solid color-mix(in srgb,var(--destaque) 45%,var(--border));padding:12px 14px;display:flex;flex-direction:column;gap:6px;transition:box-shadow .18s,opacity .25s}
.caso:hover{box-shadow:var(--sombra-2)}
.caso.feito{border-color:var(--border);opacity:.62}
.caso.feito .valor{color:var(--text-3)}
.pilula{align-self:flex-start;background:var(--destaque-tinta);color:var(--warning);border:1px solid color-mix(in srgb,var(--destaque) 50%,transparent);border-radius:9px;padding:2px 9px;font-size:11.5px;font-weight:700}
:root[data-theme=dark] .pilula{color:#F3D27A}
.lin{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cpf{font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.feito-chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text-3);cursor:pointer}
.feito-chk input{width:17px;height:17px;accent-color:var(--marca)}
.valor{font:400 18px var(--ff-titulo);font-variant-numeric:tabular-nums}
.data{font-size:12.5px;color:var(--text-3)}
.trat{color:var(--marca-texto);font-size:13.5px;font-weight:600;line-height:1.45}
.trat::before{content:"→ "}
.caso-acoes{display:flex;gap:8px;align-items:center;border-top:1px solid var(--border);padding-top:10px;margin-top:4px;flex-wrap:wrap}
.caso-acoes select{flex:1;min-width:150px;height:30px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface);padding:0 8px;font-size:12.5px}
details.det summary{font-size:12.5px;color:var(--text-3);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.det summary::before{content:"";border:4px solid transparent;border-left:5px solid currentColor;transition:transform .15s;transform-origin:2px 4px}
details.det[open] summary::before{transform:rotate(90deg)}
details.det summary::-webkit-details-marker{display:none}
.evid{margin-top:8px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;background:var(--sunken);border-radius:6px;padding:10px 12px}
.evid dt{color:var(--text-3)}
.evid dd{color:var(--text)}

/* robô */
.robo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.tile{background:var(--sunken);border-radius:6px;padding:10px 12px}
.tile b{display:block;font:400 24px/1.1 var(--ff-titulo);font-variant-numeric:tabular-nums}
.tile span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.progresso{height:8px;background:var(--barra-fundo);border-radius:4px;overflow:hidden;margin-top:12px}
.progresso i{display:block;height:100%;width:0;background:var(--marca);border-radius:4px;transition:width .35s ease-out}
.resultados{margin-top:12px;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.res{display:grid;grid-template-columns:90px 56px 1fr;gap:10px;padding:7px 12px;font-size:12.5px;border-top:1px solid var(--border);align-items:center}
.res:first-child{border-top:0}
.res .ok{color:var(--marca-texto);font-weight:800}
.res .erro{color:var(--danger);font-weight:800}
.log{margin-top:12px;background:#121611;color:#CFE8CF;font:12px/1.55 var(--mono);border-radius:6px;padding:10px 12px;height:168px;overflow:auto;white-space:pre}
.log .ok{color:#8BE28C}.log .er{color:#FF8D80}.log .t{color:#7E8C7C}

/* planilha */
.tabela-rola{overflow-x:auto}
table.plan{width:100%;border-collapse:collapse;font-size:13px}
table.plan th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);white-space:nowrap}
table.plan td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;font-variant-numeric:tabular-nums}
table.plan tr.grp td{background:var(--sunken);font-weight:700;font-size:12.5px}
table.plan td[contenteditable]{background:color-mix(in srgb,var(--destaque) 10%,transparent);min-width:240px;border-radius:2px}
table.plan td[contenteditable]:focus{outline:2px solid var(--destaque);outline-offset:-2px;background:var(--surface)}
table.plan tr.feito td{color:var(--text-3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--text-3) 50%,transparent)}
table.plan tr.feito td:last-child{text-decoration:none}

/* dashboard */
.bib{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bib b{font-weight:700}
.bib .chip{border:1px solid var(--border-strong);border-radius:9px;padding:0 8px;font-size:11.5px;font-weight:700}
.bib .meta{color:var(--text-3);font-size:13px}
.bib .btn{margin-left:auto}
.caminho{display:grid;grid-template-columns:repeat(6,minmax(112px,1fr));position:relative;overflow-x:auto;padding:6px 0 4px}
.passo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:0 6px;position:relative}
.passo::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:color-mix(in srgb,var(--marca) 45%,var(--border));z-index:0}
.passo:first-child::before{display:none}
.passo .no{width:32px;height:32px;border-radius:50%;border:2px solid var(--marca);background:var(--marca-tinta);position:relative;z-index:1;margin-bottom:8px;display:grid;place-items:center;color:var(--marca-texto)}
.passo.vazio .no{border-color:var(--border-strong);background:var(--surface);color:var(--text-3)}
.passo.agora .no{background:var(--destaque);border-color:var(--destaque-2);color:var(--destaque-ink)}
.passo h4{font-size:13px;font-weight:700}
.passo .n{font:400 26px/1.1 var(--ff-titulo);font-variant-numeric:tabular-nums}
.passo .u{font-size:12px;color:var(--text-3)}
.passo .x{font-size:11.5px;color:var(--text-3);line-height:1.4;margin-top:4px;max-width:170px}
.rodape-cam{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:8px;box-shadow:var(--sombra);padding:12px 14px;border-top:3px solid var(--marca)}
.kpi.gap{border-top-color:var(--destaque)}
.kpi.neutro{border-top-color:var(--border-strong)}
.kpi b{display:block;font:400 24px/1.15 var(--ff-titulo);font-variant-numeric:tabular-nums;margin:4px 0 2px}
.kpi small{font-size:12px;color:var(--text-3)}
.duas{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.barras{display:flex;flex-direction:column;gap:9px}
.barra-lin{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:12.5px}
.barra-lin .nome{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra-lin .val{color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right;min-width:150px}
.barra-lin .val b{color:var(--text)}
.trilho{height:12px;display:flex;gap:2px;border-radius:4px}
.trilho i{display:block;height:100%;border-radius:4px;min-width:3px;cursor:default}
.trilho .tr{background:color-mix(in srgb,var(--marca) 38%,var(--surface))}
.trilho .ab{background:var(--destaque)}
.legenda{display:flex;gap:16px;font-size:12px;color:var(--text-2);margin-top:12px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:12px;height:12px;border-radius:3px;display:inline-block}
.quitado{color:var(--marca-texto);font-weight:700}
.ass{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);font-size:13px}
.ass:first-of-type{border-top:0}
.dica{position:fixed;pointer-events:none;background:var(--text);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:5px;z-index:90;opacity:0;transition:opacity .12s;max-width:260px}

/* grind */
.grind{max-width:760px;margin:0 auto;width:100%}
.grind .caso{padding:20px 22px;gap:10px}
.grind .cpf{font-size:22px}
.grind .valor{font-size:26px}
.grind-nav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
.tecla{font:600 11px var(--mono);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--text-3)}

/* rodar o dia */
.arquivos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.arq{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.arq b{font-weight:700}
.arq .campo{height:34px;border:1px solid var(--border-strong);border-radius:4px;background:var(--sunken);display:flex;align-items:center;padding:0 10px;color:var(--text-2);font-size:12.5px;gap:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.etapas{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.etapa{text-align:center;font-size:12px;color:var(--text-3)}
.etapa i{display:block;height:6px;border-radius:3px;background:var(--barra-fundo);margin-top:8px;overflow:hidden;position:relative}
.etapa i::after{content:"";position:absolute;inset:0;width:0;background:var(--marca);transition:width .5s ease-out}
.etapa.on{color:var(--text);font-weight:700}
.etapa.on i::after{width:55%;animation:corre 1.2s ease-in-out infinite alternate}
.etapa.ok i::after{width:100%}
@keyframes corre{to{width:95%}}
.resumo{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.resumo .big b{font:400 30px/1 var(--ff-titulo)}
.resumo .big span{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.resumo .sep{width:1px;align-self:stretch;background:var(--border)}
.resumo p{flex:1;min-width:220px;font-size:13.5px;color:var(--text-2)}
.resumo p b{color:var(--marca-texto)}

.vazio{text-align:center;color:var(--text-3);padding:40px 12px;font-size:13.5px}
.aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;z-index:99;pointer-events:none;max-width:90vw}
.aviso.on{opacity:1;transform:translateX(-50%)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.duas{grid-template-columns:1fr}}
@media (max-width:900px){
  .casca{grid-template-columns:1fr}
  .lado{position:sticky;top:var(--topo-h,94px);height:auto;z-index:15;display:flex;gap:4px;overflow-x:auto;padding:6px 10px;border-right:0;border-bottom:1px solid var(--border)}
  .lado h4{display:none}
  .item{width:auto;white-space:nowrap;flex:none;padding:7px 10px}
  .item.on::before{left:8px;right:8px;top:auto;bottom:0;width:auto;height:3px;border-radius:3px 3px 0 0}
  .topo{flex-wrap:wrap}

function aplicaFiltros(arr){
  return arr.filter(c=>(!filtroData||fdata(c.data)===filtroData)&&(!filtroAss||c.assess===filtroAss)&&(!esconderTratados||!c.tratado));
}
function barraFiltros(arr,todos){
  const datas=[...new Set(todos.map(c=>fdata(c.data)))].sort((a,b)=>b.localeCompare(a));
  const ass=[...new Set(todos.map(c=>c.assess).filter(Boolean))].sort();
  return `<div class="folha filtros"><span class="rot">Filters</span>
    <select id="fData" aria-label="Date"><option value="">All dates</option>${datas.map(d=>`<option${d===filtroData?" selected":""}>${d}</option>`).join("")}</select>
    ${ass.length?`<select id="fAss" aria-label="Collection agency"><option value="">All agencies</option>${ass.map(a=>`<option${a===filtroAss?" selected":""}>${a}</option>`).join("")}</select>`:""}
    <label><input type="checkbox" id="fTrat" ${esconderTratados?"checked":""}> hide handled</label>
    <span class="soma num">${arr.length} ${arr.length===1?"case":"cases"} · ${brl(soma(arr))}</span></div>`;
}

const ROBO = {}; // estado do robô por fila
function painelRobo(k,abertos){
  const r = ROBO[k] || {status:"parado",feitos:0,erros:0,res:[],log:[]};
  ROBO[k] = r;
  const verbo = k==="emitir" ? "Write off" : "Rebuild";
  const unid = k==="emitir" ? (abertos.length===1?"case":"cases") : (abertos.length===1?"agreement":"agreements");
  const total = r.total || abertos.length;
  return `<div class="folha" id="robo">
    <div class="acao"><div class="t"><b class="num">${esc(FILA[k].titulo)}, ${abertos.length} ${abertos.length===1?"case":"cases"}, ${brl(soma(abertos))}</b>
      <span>${k==="emitir"?"The bot issues the new boleto, checks the amount and writes it off with the rejected payment.":"The bot rebuilds the agreement for the balance in each agency login, one browser per login."}</span></div>
      <button class="btn prim" type="button" id="btnRobo" ${abertos.length&&r.status!=="rodando"?"":"disabled"}>${r.status==="rodando"?"Running":verbo+" "+abertos.length+" "+unid}</button></div>
    <div class="robo">
      <div class="tile"><span>Ready</span><b class="num">${abertos.length}</b></div>
      <div class="tile"><span>Need action</span><b class="num">0</b></div>
      <div class="tile"><span>${r.status==="rodando"?"Running":"Last run"}</span><b class="num">${r.feitos+r.erros}/${total||0}</b></div>
    </div>
    <div class="progresso"><i style="width:${total?Math.round(100*(r.feitos+r.erros)/total):0}%"></i></div>
    ${r.res.length?`<div class="resultados">${r.res.map(x=>`<div class="res"><span class="num">${x.nn}</span><span class="${x.ok?"ok":"erro"}">${x.ok?"OK":"ERROR"}</span><span>${esc(x.msg)}</span></div>`).join("")}</div>`:""}
    <div class="log" id="logRobo" aria-label="Bot log">${r.log.length?r.log.join("\n"):'<span class="t">The bot log appears here when the run starts.</span>'}</div>
  </div>`;
}
function rodarRobo(k){
  const alvo = daFila(k).filter(c=>!c.tratado);
  if(!alvo.length) return;
  const r = ROBO[k] = {status:"rodando",feitos:0,erros:0,res:[],log:[],total:alvo.length};
  const hh = ()=>{const d=new Date();return [d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,"0")).join(":");};
  setTarja(true, k==="emitir"?"Write-off bot running":"Rebuild bot running");
  r.log.push(`<span class="t">${hh()}</span>  [bot] ${alvo.length} ${k==="emitir"?"cases in the write-off queue":"agreements to rebuild"}`);
  render();
  let i = 0;
  const passo = ()=>{
    if(i>=alvo.length){
      r.status="parado";
      r.log.push(`<span class="t">${hh()}</span>  [bot] done: ${r.feitos} ok · ${r.erros} error(s)`);
      setTarja(false); render(); aviso(`${r.feitos} of ${alvo.length} completed by the bot`); return;
    }
    const c = alvo[i++], nn = String(7710400 + c.id*37);
    const t1=(0.38+Math.random()*.2).toFixed(2), t2=(0.8+Math.random()*.6).toFixed(2);
    r.log.push(`<span class="t">${hh()}</span>  [bot] Row ${i}: ${nn} | ${c.valor.toFixed(2)}`);
    const ok = true;
    r.log.push(`<span class="t">${hh()}</span>  [bot]    <span class="ok">OK: ${k==="emitir"?"BOLETO WRITTEN OFF":"AGREEMENT REBUILT FOR THE BALANCE"}</span>  [lookup ${t1}s · confirm ${t2}s]`);
    r.res.unshift({nn, ok, msg: k==="emitir"?"Boleto written off":"Agreement rebuilt and written off"});
    if(ok){ r.feitos++; c.tratado=true; tratadosHoje++; } else r.erros++;
    render();
    const lg=$("#logRobo"); if(lg) lg.scrollTop=lg.scrollHeight;
    setTimeout(passo, 900);
  };
  setTimeout(passo, 700);
}

  return `<div class="folha bib"><b>Day library</b><span class="chip num">63 days</span><span class="meta num">4,912 cases · ${p.length} pending</span><button class="btn peq" type="button" id="btnArquivar">Archive the day</button></div>
    ${caminho}
    <div class="folha-cab" style="margin:8px 0 -4px"><h2>Month view · ${mesSel}</h2><span class="meta">everything rejected this month, by rejection date</span>
      <span class="dir"><select id="mes" class="btn peq" aria-label="Month">${Object.keys(MESES).map(m=>`<option${m===mesSel?" selected":""}>${m}</option>`).join("")}</select></span></div>
    ${kpis}
    <div class="duas">${dinheiro}<div style="display:flex;flex-direction:column;gap:14px">${atual?idade:""}${atual?assess:`<div class="folha vazio">Month closed: nothing open.</div>`}</div></div>
    ${porDia}`;
}

/* ── render ── */
function render(){
  menu();
  $("#titulo").textContent = tituloDe(vista);
  const sub = $("#subtitulo");
  sub.hidden = !busca || vista!=="todos";
  if(!sub.hidden) sub.textContent = "Search results for “"+busca+"”";
  let h;
  if(FILA[vista]) h = vistaFila(vista);
  else if(vista==="grind") h = vistaGrind();
  else if(vista==="rodar") h = vistaRodar();
  else if(vista==="resolvidos") h = vistaLista(CASOS.filter(c=>c.tratado),"Resolved today");
  else if(vista==="todos"){
    const q = busca.replace(/\D/g,"");
    const arr = busca ? CASOS.filter(c=>(q&&(c.cpf.replace(/\D/g,"").includes(q)||c.contrato.replace(/\D/g,"").includes(q)))||c.contrato.toLowerCase().includes(busca.toLowerCase())) : CASOS;
    h = vistaLista(arr, busca?"Search":"All cases in the file");
  }
  else h = vistaDashboard();
  $("#conteudo").innerHTML = h;
  const lado=$("#lado"), on=lado.querySelector(".item.on");
  if(on && getComputedStyle(lado).display==="flex") lado.scrollLeft = Math.max(0,on.offsetLeft-12);
}
function medeTopo(){ document.documentElement.style.setProperty("--topo-h", document.querySelector(".topo").offsetHeight+"px"); }
addEventListener("resize",medeTopo); medeTopo();
function ir(v){ vista=v; grindIdx=0; filtroData=""; filtroAss=""; if(v!=="todos"){busca="";$("#busca").value="";} try{history.replaceState(null,"","#"+v);}catch(e){} render(); window.scrollTo({top:0}); }
function setTarja(on,txt){ $("#tarja").classList.toggle("rodando",on); $("#tarjaTxt").textContent = on?txt:"Nothing running now"; }

/* ── eventos ── */
$("#lado").addEventListener("click",e=>{const b=e.target.closest("[data-v]"); if(b) ir(b.dataset.v);});
$("#conteudo").addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="fData"){filtroData=t.value;render();return;}
  if(t.id==="fAss"){filtroAss=t.value;render();return;}
  if(t.id==="fTrat"){esconderTratados=t.checked;render();return;}
  if(t.id==="mes"){mesSel=t.value;render();return;}
  const el=t.closest("[data-id]"); if(!el) return;
  const c=CASOS.find(x=>x.id==el.dataset.id);
  if(t.dataset.acao==="feito"){ c.tratado=t.checked; tratadosHoje+=t.checked?1:-1; aviso(t.checked?"Marked as handled":"Back in the queue"); render(); }
  if(t.dataset.acao==="mover"){ const de=FILA[c.fila].nome; c.fila=t.value; aviso(`Case moved from ${de} to ${FILA[c.fila].nome}`); render(); }
});
$("#conteudo").addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.acao==="copiar"){ const el=t.closest("[data-id]"); const c=CASOS.find(x=>x.id==el.dataset.id); aviso("CPF copied ("+c.cpf+", masked in this demo)"); return; }
  if(t.id==="btnPlanilha"){ aviso("Spreadsheet generated for the operators (demo: no file is downloaded)"); return; }
  if(t.id==="btnRobo"){ rodarRobo(vista); return; }
  if(t.id==="btnRodada"){ rodarDia(); return; }
  if(t.id==="btnArquivar"){ aviso("Day archived in the library (demo)"); return; }
  if(t.dataset.g){ acaoGrind(t.dataset.g); }
});
$("#conteudo").addEventListener("focusout",e=>{
  const td=e.target; if(!td.matches||!td.matches("td[contenteditable]")) return;
  const c=CASOS.find(x=>x.id==td.parentElement.dataset.id); const v=td.textContent.trim();
  if(c && v!==c.trat){ c.trat=v; aviso("Handling updated: your edit overrides the engine suggestion"); }
});
function acaoGrind(a){
  const p=pend(); if(!p.length) return;
  if(a==="x"){ const c=p[grindIdx]; c.tratado=true; tratadosHoje++; aviso("Completed. Next case."); }
  else grindIdx=(grindIdx+Number(a)+p.length)%p.length;
  render();
}
document.addEventListener("keydown",e=>{
  if(vista!=="grind"||e.target.matches("input,select,textarea,[contenteditable]")) return;
  if(e.key==="j"||e.key==="ArrowRight") acaoGrind("1");
  else if(e.key==="k"||e.key==="ArrowLeft") acaoGrind("-1");
  else if(e.key==="x") acaoGrind("x");
});
let bt; $("#busca").addEventListener("input",e=>{clearTimeout(bt);bt=setTimeout(()=>{busca=e.target.value.trim(); vista=busca?"todos":(vista==="todos"?"dashboard":vista); render();},180);});
$("#btnTema").addEventListener("click",()=>{
  const d=document.documentElement.getAttribute("data-theme")!=="dark";
  document.documentElement.setAttribute("data-theme",d?"dark":"light");
  $("#temaTxt").textContent=d?"Light":"Dark";
  try{localStorage.setItem("demo-tema",d?"dark":"light");}catch(e){}
});
$("#btnRecarregar").addEventListener("click",()=>{const d=new Date();$("#conferido").textContent="Checked at "+d.toLocaleTimeString("en-GB");render();aviso("Data checked again");});
$("#btnRelatorio").addEventListener("click",()=>{
  const p=pend(); const linhas=FILAS.map(f=>[f.titulo,daFila(f.k).filter(c=>!c.tratado)]).filter(x=>x[1].length).map(x=>`- ${x[0]}: ${x[1].length} (${brl(soma(x[1]))})`);
  const txt=`Rejections 2026-10-09 (fictitious data)\n${p.length} open cases, ${brl(soma(p))}\n${linhas.join("\n")}`;
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>aviso("Daily report copied")).catch(()=>aviso("Report ready (the clipboard is not available here)"));
});
const dica=$("#dica");
document.addEventListener("mousemove",e=>{
  const t=e.target.closest&&e.target.closest("[data-dica]");
  if(!t){dica.style.opacity=0;return;}
  dica.textContent=t.dataset.dica; dica.style.opacity=1;
  const x=Math.min(e.clientX+14, innerWidth-dica.offsetWidth-8); dica.style.left=x+"px"; dica.style.top=(e.clientY+16)+"px";
});
if(document.documentElement.getAttribute("data-theme")==="dark") $("#temaTxt").textContent="Light";
const ini=(location.hash||"").slice(1);
vista = (FILA[ini]||["grind","rodar","dashboard","resolvidos","todos"].includes(ini)) ? ini : "dashboard";
render();
</script>
</body>
</html>
